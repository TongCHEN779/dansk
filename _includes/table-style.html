<style>
    table {
        border-collapse: collapse;
        width: 100%;
    }
    tr:nth-child(even) {
        background-color: #f2f2f2;
    }
    tr:nth-child(odd) {
        background-color: #ffffff;
    }
    th, td {
        border: 1px solid #dddddd;
        padding: 8px;
        text-align: left;
    }
    {% if include.col1 %}
    th:nth-child(1), td:nth-child(1) { width: {{ include.col1 }}; }
    th:nth-child(2), td:nth-child(2) { width: {{ include.col2 }}; }
    {% endif %}
</style>
