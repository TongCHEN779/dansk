<script>
    /* Avatar "talks" while a word plays. Only the area around the mouth is warped
       (the lower lip and chin move down smoothly, fading out to nothing at the edges),
       so the rest of the face never moves. Drawn on a canvas laid exactly over the
       avatar image; the image itself is never resized or swapped. */
    var Talk = (function () {
        /* all values are fractions of the source image */
        var MX = 0.56, HW = 0.17;                  /* mouth centre x, half-width of the affected area */
        var Y_TOP = 0.640, Y_LIP = 0.676, Y_END = 0.745, Y_FIX = 0.648;  /* area top, lower lip, area bottom, upper lip (stays) */
        var MAX_DROP = 0.04;                       /* lower-lip travel, as a fraction of image height */
        var COLS = 18, ROWS = 26;

        var st = { src: null, canvas: null, img: null, raf: 0, open: 0, target: 0, nextAt: 0, talking: false, cur: null };

        function smooth(t) { t = t < 0 ? 0 : t > 1 ? 1 : t; return t * t * (3 - 2 * t); }
        function vprofile(y) {     /* 0 above the upper lip, 1 at the lower lip, back to 0 at the chin */
            if (y <= Y_FIX) return 0;
            if (y <= Y_LIP) return smooth((y - Y_FIX) / (Y_LIP - Y_FIX));
            return 1 - smooth((y - Y_LIP) / (Y_END - Y_LIP));
        }

        function preload() {
            var el = document.getElementById("profile-avatar");
            if (el && !st.src) { st.src = new Image(); st.src.src = el.src; }
        }
        if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", preload); else preload();

        function ensure(imgEl) {
            if (st.canvas && st.canvas.parentNode) return true;
            if (!st.src || !st.src.complete || !st.src.naturalWidth) return false;
            var box = imgEl.parentNode;
            while (box && getComputedStyle(box).display === "inline") box = box.parentNode;
            if (!box) return false;
            var dpr = window.devicePixelRatio || 1;
            var w = imgEl.clientWidth, h = imgEl.clientHeight;
            if (!w || !h) return false;
            if (getComputedStyle(box).position === "static") box.style.position = "relative";
            var br = imgEl.getBoundingClientRect(), bb = box.getBoundingClientRect();
            var c = document.createElement("canvas");
            c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
            var cs = c.style;
            cs.position = "absolute";
            cs.left = (br.left - bb.left + imgEl.clientLeft) + "px";
            cs.top = (br.top - bb.top + imgEl.clientTop) + "px";
            cs.width = w + "px"; cs.height = h + "px";
            cs.borderRadius = "50%"; cs.pointerEvents = "none"; cs.margin = "0";
            c.setAttribute("aria-hidden", "true");
            box.appendChild(c);
            st.canvas = c; st.img = imgEl;
            st.bg = getComputedStyle(imgEl).backgroundColor;
            if (!st.bg || st.bg === "transparent" || st.bg === "rgba(0, 0, 0, 0)") st.bg = "#fff";
            return true;
        }

        function draw() {
            var c = st.canvas, g = c.getContext("2d"), im = st.src;
            var iw = im.naturalWidth, ih = im.naturalHeight, cw = c.width, ch = c.height;
            var s = Math.max(cw / iw, ch / ih), dw = iw * s, dh = ih * s;
            var dx = (cw - dw) / 2, dy = (ch - dh) / 2;
            var drop = st.open * MAX_DROP * dh;

            g.fillStyle = st.bg; g.fillRect(0, 0, cw, ch);
            g.drawImage(im, dx, dy, dw, dh);               /* whole face, untouched */
            if (drop < 0.3) return;

            /* mouth area: redraw in thin strips, each shifted vertically by a smooth amount */
            var x0 = (MX - HW) * iw, colW = (2 * HW * iw) / COLS;
            var y0 = Y_TOP * ih, rowH = ((Y_END - Y_TOP) * ih) / ROWS;
            for (var i = 0; i < COLS; i++) {
                var sx = x0 + i * colW;
                var u = ((sx + colW / 2) / iw - MX) / HW;               /* -1 … 1 across the area */
                var hx = Math.cos(Math.min(1, Math.abs(u)) * Math.PI / 2); hx *= hx;
                var prev = null;
                for (var j = 0; j <= ROWS; j++) {
                    var ys = y0 + j * rowH, yn = ys / ih;
                    var yd = dy + ys * s + drop * hx * vprofile(yn);
                    if (prev) {
                        g.drawImage(im, sx, prev.ys, colW, rowH,
                                    dx + sx * s, prev.yd, colW * s + 0.7, yd - prev.yd + 0.7);
                    }
                    prev = { ys: ys, yd: yd };
                }
            }
            /* dark inside of the mouth, a flat ellipse that grows with the opening */
            var mx = dx + MX * iw * s, my = dy + (Y_FIX * ih) * s + drop * 0.45;
            var rx = HW * iw * s * 0.38 * (0.55 + 0.45 * st.open), ry = Math.max(0.5, drop * 0.42);
            g.save(); g.translate(mx, my); g.scale(1, ry / rx);
            var g2 = g.createRadialGradient(0, 0, 0, 0, 0, rx);
            g2.addColorStop(0, "rgba(70, 58, 64," + (0.62 * st.open) + ")");
            g2.addColorStop(0.7, "rgba(70, 58, 64," + (0.38 * st.open) + ")");
            g2.addColorStop(1, "rgba(70, 58, 64, 0)");
            g.fillStyle = g2; g.beginPath(); g.arc(0, 0, rx, 0, Math.PI * 2); g.fill(); g.restore();
        }

        function frame(t) {
            if (!st.canvas) return;
            if (st.talking && t >= st.nextAt) {
                /* irregular "syllables": mostly open-ish, sometimes nearly closed */
                st.target = Math.random() < 0.22 ? Math.random() * 0.15 : 0.45 + Math.random() * 0.55;
                st.nextAt = t + 70 + Math.random() * 110;
            }
            if (!st.talking) st.target = 0;
            st.open += (st.target - st.open) * 0.35;
            draw();
            if (!st.talking && st.open < 0.02) { finish(); return; }
            st.raf = requestAnimationFrame(frame);
        }

        function finish() {
            cancelAnimationFrame(st.raf);
            if (st.canvas && st.canvas.parentNode) st.canvas.parentNode.removeChild(st.canvas);
            st.canvas = null; st.open = 0; st.target = 0;
        }

        return {
            start: function (imgEl, owner) {
                st.cur = owner; st.talking = true;
                if (st.canvas) return;
                if (!ensure(imgEl)) return;       /* not ready: simply no animation */
                st.nextAt = 0;
                st.raf = requestAnimationFrame(frame);
            },
            stop: function (owner) {
                if (st.cur === owner) st.talking = false;   /* mouth eases shut, then the overlay is removed */
            }
        };
    })();

    function playSound(soundId) {
        var audioElement = document.getElementById(soundId);
        if (!audioElement) return;
        var profileImage = document.getElementById("profile-avatar");

        function done() { if (profileImage) Talk.stop(audioElement); }

        /* play() must be called straight from the tap (mobile browsers block it otherwise),
           and it also starts loading the file, so no readyState check is needed. */
        audioElement.preload = "auto";
        audioElement.currentTime = 0;
        audioElement.onended = done;
        audioElement.onerror = done;
        audioElement.onpause = done;
        audioElement.onplaying = function () { if (profileImage) Talk.start(profileImage, audioElement); };
        var p = audioElement.play();
        if (p && p.catch) p.catch(function (e) { console.warn("Audio failed:", e); done(); });
    }
</script>
