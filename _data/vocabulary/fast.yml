sections:
- title: Danske Udtryk
  headers:
  - Udtryk
  - Engelsk
  - Eksempler
  entries:
  - udtryk: aber dabei
    engelsk: aberration
    eksempler: Et lille aber dabei ved udflytningen af debatten var dog, at kun tre journalister dukkede op til det ellers stort anlagte pressemøde.
  - udtryk: ad gangen
    engelsk: at a time
    eksempler: Huset er lejet for et år ad gangen.
  - udtryk: affinde
    engelsk: put up with
    eksempler: Enten må man affinde sig med en ledighed omkring 300.000 eller også må arbejderbevægelsens mærkesager igennem.
  - udtryk: afhænge af
    engelsk: depend on
    eksempler: Hvor meget alkohol et menneske kan tåle afhænger af leverens sundhedstilstand og personens legemsvægt.
  - udtryk: afvige fra
    engelsk: differ from
    eksempler: Kontantværdien vil ofte afvige fra ejendommens pris i prioriteret stand.
  - udtryk: -agtig
    engelsk: -ish, -y, -ous
    eksempler: katteagtig, barnagtig, grødagtig, fejlagtig, drilagtig
  - udtryk: allerbedst som
    engelsk: as
    eksempler: 'Allerbedst som vi sidder, så siger han, den gamle mand: "Hvem sejler du egentlig for?".'
  - udtryk: anstrenge sig
    engelsk: make an effort
    eksempler: Jeg måtte anstrenge mig for at forstå hans russiske.
  - udtryk: ase og mase
    engelsk: hustle and bustle
    eksempler: De asede og masede .. men til sidst fik de da kassen bugseret ud gennem baglokalet til bilen i gården.
  - udtryk: bakke op
    engelsk: support
    eksempler: Englænderne bakker op om indførelsen af demokratiske reformer i Hong Kong.
  - udtryk: bane vej/vejen
    engelsk: pave the way
    eksempler: Trods alle forhindringer endte KU's to første kvindelige studerende med en kandidatgrad og blev de pionerer, der banede vejen for kvinder i dansk akademia.
  - udtryk: beklage sig
    engelsk: complain
    eksempler: Mor beklager sig over alt, hvad der kan være at klage over.
  - udtryk: bero på
    engelsk: be based on
    eksempler: Behandlingen må bero på gensidig tillid, således at patienten ikke føler sin integritet undergravet.
  - udtryk: betale sig
    engelsk: pay off
    eksempler: Det kan ikke betale sig at bygge i dagens Danmark. Byggeomkostningerne er høje, fordi arbejdsløn og materialer er dyre.
  - udtryk: bide i græsset
    engelsk: give up
    eksempler: Leonora Christina kunne ikke overvindes. Det var umuligt at få hende til at bide i græsset. Altid kom hun på benene igen.
  - udtryk: bide på krogen
    engelsk: take the bait
    eksempler: Skallen bliver straks smidt ned i en vandspand til de andre, der har bidt på krogen.
  - udtryk: blive ved
    engelsk: keep
    eksempler: Hun blev ved med at stirre på mig med opspilede øjne.
  - udtryk: bortset fra
    engelsk: except for
    eksempler: Det kan være svært at forstå, hvad der får folk til at købe en sådan vare – bortset altså fra prisen.
  - udtryk: bryde sig om
    engelsk: care about
    eksempler: Muriel brød sig ikke om sin vært og undgik helst at snakke med ham.
  - udtryk: byde på
    engelsk: offer
    eksempler: De evakuerede beboere blev budt på en isvaffel i varmen.
  - udtryk: byde/hilse velkommen
    engelsk: welcome/greet
    eksempler: Et par karle bar bagagen ind, kroværten bød velkommen og mutter præsenterede selv værelserne.
  - udtryk: bære præg af
    engelsk: bear the mark of
    eksempler: Hans hoved bærer tydeligt præg af mødet med BZ'erne.
  - udtryk: den blå luft
    engelsk: pure nothingness
    eksempler: Hvis man har gonoré, er smitten ikke kommet ud af den blå luft.
  - udtryk: den onde
    engelsk: the evil
    eksempler: Overlevede de forhørene beviste det deres skyld, for hvem kunne have hjulpet dem undtagen den onde?
  - udtryk: den rådne banan
    engelsk: the rotten banana
    eksempler: Den rådne banan har været forskernes geografiske beskrivelse af de skrantende udkantsområder, der begynder i Vendsyssel, fortsætter ned gennem det vestlige Jylland, videre gennem den sydlige del af Sønderjylland over til de sydfynske øer, Langeland, Lolland-Falster og Bornholm.
  - udtryk: den slagne vej
    engelsk: the beaten path
    eksempler: Du er fristet til at følge den slagne vej, men den vil næppe føre til det mål, du har sat dig.
  - udtryk: det hvide ud af øjnene
    engelsk: expensive
    eksempler: Huawei har markeret sig stærkt de seneste år med en række prisvenlige mobiler for dem, der gerne vil have smarte funktioner, men ikke ønsker at betale det hvide ud af øjnene.
  - udtryk: det private erhvervsliv
    engelsk: the private sector
    eksempler: Det private erhvervsliv i Vordingborg har gjort et scoop. Det har på få år skaffet unge på bistandshjælp ud på arbejdsmarkedet.
  - udtryk: det skyldes
    engelsk: it is due to
    eksempler: Fodvorter skyldes en virusinfektion og kan derfor smitte.
  - udtryk: dukke op
    engelsk: show up
    eksempler: Så vil journalisterne dukke op, lave et par historier og smutte igen.
  - udtryk: dumme sig
    engelsk: make mistakes
    eksempler: Alle lo. Hun blev rød i kinderne og vidste at hun havde dummet sig.
  - udtryk: (hele) døgnet/året rundt
    engelsk: around the clock, all year around
    eksempler: Krisecentret er åbent døgnet rundt alle ugens dage.
  - udtryk: efterhånden som
    engelsk: as
    eksempler: Byen blev mørkere efterhånden som butikkerne lukkede.
  - udtryk: egne sig
    engelsk: fit
    eksempler: Tynde asparges egner sig bedst til suppe.
  - udtryk: en del/bid af kagen
    engelsk: a slice of cake
    eksempler: Når en person arver, snupper staten en betragtelig del af kagen
  - udtryk: en/et eller anden/andet, en eller andens
    engelsk: something, someone
    eksempler: Hun .. ser ned på bordet, en eller anden har på et eller andet tidspunkt skrevet et eller andet på dets blanke plastoverflade.
  - udtryk: en gang imellem
    engelsk: once in a while
    eksempler: Han svømmede med hovedet under og hævede det en gang imellem for at trække luft ind.
  - udtryk: et væld af
    engelsk: a magnitude of
    eksempler: Stedmorblomster findes i et væld af farver.
  - udtryk: falde i søvn
    engelsk: fall into sleep
    eksempler: Han faldt i søvn og drømte, at han var en lille dreng, der faldt fra en klippe.
  - udtryk: falde ind
    engelsk: occur to
    eksempler: Den tanke, at jeg som heteroseksuel kunne få AIDS, var aldrig faldet mig ind.
  - udtryk: finde/lede efter en nål i en høstak
    engelsk: find/look for a needle in a haystack
    eksempler: At finde de gode italienske vine i Danmark kan ofte sammenlignes med den berømte nål i høstakken.
  - udtryk: finde ... frem
    engelsk: find ... out
    eksempler: Så fandt Lisbeth en bold frem, og de begyndte at spille.
  - udtryk: finde rundt
    engelsk: find the way around
    eksempler: Det er nemt at finde rundt i Barcelona, som har en glimrende undergrundsbane.
  - udtryk: finde ud af
    engelsk: figure out
    eksempler: Susanne fandt ud af, at hendes kondi ikke var nær så god, som hun troede.
  - udtryk: for alvor
    engelsk: seriously
    eksempler: Julefeberen har for alvor bredt sig over lille Dannevang.
  - udtryk: for guds/himlens skyld
    engelsk: for god/heaven's sake
    eksempler: Dæmp farten overhold loven kør pænt og for guds skyld PAS PÅ BØRNENE.
  - udtryk: for så vidt (angår)
    engelsk: as far as
    eksempler: Kun for så vidt angår arbejdsløshedstallene, har Danmark klaret sig dårligere i Jørgensen-perioden end i Schlüter-perioden.
  - udtryk: forbinde (sig) til
    engelsk: connect to
    eksempler: Atomer kan forbinde sig med hinanden til større strukturer, molekyler.
  - udtryk: forud for
    engelsk: in advance
    eksempler: Hensynet til økonomi og vækst skal ikke gå forud for miljøet.
  - udtryk: fra oven
    engelsk: from above
    eksempler: Fly med specialudstyr fotograferer kommunen fra oven.
  - udtryk: før/inden jeg (du, ..) fik set mig (dig, ..) om
    engelsk: before I (you, ...) knew it
    eksempler: Inden han havde fået set sig om, havde han drukket tre bajere, selv om han var lige ved at gå.
  - udtryk: før sig frem
    engelsk: show off
    eksempler: Politikerne på Christiansborg fører sig frem, som om de alene ejede landet, og vi andre ikke eksisterede.
  - udtryk: få det til
    engelsk: make it to
    eksempler: Han talte flaskerne og fik det til niogtredive.
  - udtryk: få lov til
    engelsk: be allowed to
    eksempler: Hun får lov til at gå på toilettet, eskorteret af en kvindelig betjent.
  - udtryk: få/have råd til
    engelsk: be able to afford
    eksempler: At spise ude var ganske enkelt ikke noget, der var råd til i en ganske almindelig familie med børn.
  - udtryk: få øje på
    engelsk: spot
    eksempler: Julie havde fået øje på Liv og vinkede til hende med fortvivlelsen malet i alle træk.
  - udtryk: ganske vist
    engelsk: admittedly
    eksempler: At ryge var ganske vist dyrt – men én last skal man have, trøstede hun sig selv.
  - udtryk: gemme ... væk/bort/(af vejen)
    engelsk: hide ... away/out of the way
    eksempler: Egentlig var udsendelsen bedst tjent med at blive forbigået i tavshed, gemt væk og glemt for altid.
  - udtryk: give køb på noget
    engelsk: give up
    eksempler: Fidel Castro slog som ventet fast at Cuba ikke giver køb på sine socialistiske principper.
  - udtryk: give ... videre til / videregive ... til
    engelsk: pass ... to
    eksempler: Robin Hood scorer de riges guld for at give det videre med rund hånd til Nottingham-områdets fattige og svage.
  - udtryk: grine ud
    engelsk: laugh at
    eksempler: Hvorfor skulle jeg grines ud, bare fordi jeg ikke var dranker og junker og sendte mit barn på børnehjem?
  - udtryk: gå forud
    engelsk: precede
    eksempler: Hans død var ikke ventet – der var ikke gået sygdom forud.
  - udtryk: gå fra snøvsen, tabe snøvsen
    engelsk: lose self-control, become upset
    eksempler: Hun gjorde noget ved ham. Kørte rundt med ham. Fik ham til at tabe snøvsen og føle sig komplet fåret.
  - udtryk: gå i den modsatte grøft
    engelsk: go in the opposite direction
    eksempler: Naturligvis skal man også have sine egne interesser, for man skal heller ikke gå i den modsatte grøft og blive afhængig af hinanden og ikke kunne finde ud af at være alene.
  - udtryk: gå i gang med
    engelsk: get started with
    eksempler: Jeg kan ikke vente med at gå i gang med at arbejde for borgerne i Aberavon.
  - udtryk: gå i hi
    engelsk: hibernate
    eksempler: Anna vidste, at bjørne gik i hi. Ligger i en hule og sover hele vinteren.
  - udtryk: gå i opfyldelse
    engelsk: come true
    eksempler: Vores drøm om en lille butik var gået i opfyldelse.
  - udtryk: gå rundt med nogen/noget i maven
    engelsk: have ambitions or dreams
    eksempler: Hun har altid gået rundt med en lille forfatter i maven, også selv om hun siden sit 10. år har arbejdet i skuespiller-branchen.
  - udtryk: gøre/lave grin med
    engelsk: make fun of
    eksempler: At gøre grin med dronningen er jo ikke noget man normalt kan tillade sig.
  - udtryk: gøre indtryk på
    engelsk: make impression on
    eksempler: Det var tydeligt at onkel Oscars ord havde gjort indtryk på hende.
  - udtryk: gøre sig umage
    engelsk: try the best
    eksempler: Jeg prøver virkelig at gøre mig umage for at forstå, hvad du mener.
  - udtryk: have brug for
    engelsk: need to
    eksempler: Lad os få nogle flere folkeafstemninger, det er der i høj grad brug for.
  - udtryk: have det svært/godt/dårligt/dejligt/bedst, ...
    engelsk: feel difficult/good/bad/great/best, ...
    eksempler: Hjælp et barn som har det svært i Rwanda, eller i Mexico, Indien og Kenya eller et andet fattigt land.
  - udtryk: have fornøjelse af
    engelsk: have the pleasure of
    eksempler: Et barn kan have utrolig meget fornøjelse af akvariefisk.
  - udtryk: have i tankerne
    engelsk: keep in mind
    eksempler: Han sagde, at banken ikke i øjeblikket har en rentestigning i tankerne.
  - udtryk: have/tage jahat/ja-hat/nejhat/nej-hatten på
    engelsk: be positive/negative
    eksempler: De går ind i "det kreative rum", hvor vi beder dem om at tage jahatten på og tage det seriøst, når en kammerat har en ide.
  - udtryk: have let ved
    engelsk: be good at
    eksempler: Allerede som barn opdagede Dirch Passer, at han havde let ved at få folk til at grine.
  - udtryk: have/få ret i
    engelsk: be/get right about
    eksempler: Jeg lytter gerne til, hvad andre mener, men det betyder ikke, jeg giver alle ret i deres synspunkter.
  - udtryk: have svært ved noget
    engelsk: have difficulty with something
    eksempler: Har du svært ved at komme op om morgenen?
  - udtryk: have/få travlt
    engelsk: be/get busy
    eksempler: Selv om hun i mange år har været en travl skuespiller på Odense Teater, i talrige revyer og meget andet, har hun nu aldrig haft for travlt til at være mor.
  - udtryk: hidtil uset
    engelsk: unprecedented
    eksempler: Står vi uden for politisamarbejdet, vil vi på samme måde risikere at blive opsamlingssted for international kriminalitet i et hidtil uset omfang.
  - udtryk: hilsen fra ...
    engelsk: '... send greeting'
    eksempler: Vi skulle hilse dig fra Casper, de spørger efter dig henne i tennisklubben.
  - udtryk: holde inde
    engelsk: stop
    eksempler: Stedfar bad ham om at holde inde med sit fuldemandsævl.
  - udtryk: holde op
    engelsk: stop
    eksempler: Regnen er holdt op, og han kigger ud på solens gule lys.
  - udtryk: hvad ... angår
    engelsk: in terms of/concerning ...
    eksempler: Indtagelse af fedt er meget omdiskuteret, både hvad angår fedttypen og fedtmængden.
  - udtryk: hvad (hvem, hvor, hvilken/hvilket, ingen/intet, nogen/noget, når) som helst
    engelsk: anything, anybody, anywhere, any, no one/nothing, anyone/anything, anytime
    eksempler: Hun gabte og så ud til at kunne falde i søvn når som helst.
  - udtryk: hæfte sig (fast) på/til
    engelsk: be (firmly) attached to
    eksempler: Musevikke klatrer i vejret mellem andre planter ved at hæfte sig fast med bladenes slyngtråde.
  - udtryk: i anledning af
    engelsk: on the occasion of
    eksempler: Søndag d. 5 nov. kl. 15.00 er der i anledning af Jesuskirkens 101 års fødselsdag koncert i kirken.
  - udtryk: i bund og grund
    engelsk: essentially, basically
    eksempler: Finansloven er i bund og grund et budget for staten.
  - udtryk: i bytte med
    engelsk: in exchange for
    eksempler: Han købte klude i bytte med hægter, bændler og knapper.
  - udtryk: i (den) sidste ende
    engelsk: in the end
    eksempler: De holdt stædigt fast ved deres beslutning, og viljen til at kæmpe gav som bekendt pote i den sidste ende.
  - udtryk: i det hele (taget)
    engelsk: in general
    eksempler: Brecht skrev ikke erindringer, var i det hele meget nøjsom med at give oplysninger om sig selv.
  - udtryk: i det mindste / i hvert fald
    engelsk: at least
    eksempler: Lejligheden var ikke særlig stor, men den var i det mindste selvstændig og med egen indgang.
  - udtryk: i dølgsmål
    engelsk: in secret
    eksempler: Hvorfor skal et så betydningsfuldt anliggende afgøres i dølgsmål uden åben og fri kvalificeret debat?
  - udtryk: i etaper
    engelsk: in stages
    eksempler: Den nye vold blev bygget i to etaper, først syd for porten dernæst nord for.
  - udtryk: i forbindelse med, ifm.
    engelsk: in connection with
    eksempler: Ford gav en favørpris for min gamle bil i forbindelse med, at jeg købte en ét år gammel Escort samme sted.
  - udtryk: i forhold til
    engelsk: in relation to, compared to
    eksempler: Kirken, der var kølig og mørk i forhold til det klare majsolskin udenfor, var .. helt tom.
  - udtryk: i form
    engelsk: in shape
    eksempler: Paula .. holder sig i form med daglig gymnastik.
  - udtryk: i forvejen
    engelsk: already, in advance
    eksempler: Denne kartoffelret kan laves i forvejen, skæres ud i passende stykker og varmes op igen i en varm ovn.
  - udtryk: i givet fald
    engelsk: if so, if applicable
    eksempler: Om vi må ændre naturen – og i givet fald hvor langt, er et spørgsmål, som det i høj grad er op til den enkelte at tage stilling til.
  - udtryk: i gåafstand til/fra
    engelsk: within walking distance to/from
    eksempler: Vodroffsvej ligger i gåafstand til centrum og til de gode handelsgader.
  - udtryk: i henhold til
    engelsk: according to
    eksempler: På alle solgte produkter ydes 1 års reklamationsret i henhold til købeloven.
  - udtryk: i hvert/al/alt/alle fald
    engelsk: at least, in any case
    eksempler: Danskere har jo heldigvis humoristisk sans. Nogle af dem i al fald.
  - udtryk: i hvert/nogle/alle tilfælde
    engelsk: in each/some/all case
    eksempler: Det løser i hvert tilfælde ikke nogen problemer at gå rundt og slå løs på hinanden.
  - udtryk: i høj grad
    engelsk: to a great extent
    eksempler: Her er Japan i høj grad international leverandør af både maskiner og komponenter.
  - udtryk: i kraft af
    engelsk: because of
    eksempler: Der er en glidende overgang mellem professionelle og amatører. Og det hele fungerer – ikke på trods af forskellen, men i kraft af den.
  - udtryk: i løbet af natten/dagen/året
    engelsk: during the night/day/year
    eksempler: Søndag kommer der en del sol, men i løbet af dagen antagelig mere skyet fra vest.
  - udtryk: i mellemtiden
    engelsk: in the meantime
    eksempler: Flere politifolk blev i hast sendt til adressen i Jelling, men i mellemtiden var manden forsvundet.
  - udtryk: i modsætning til
    engelsk: unlike
    eksempler: Også vi mennesker, som jo ellers (i modsætning til dyrene) har lyst til at parre os året rundt, får ekstra lyst om foråret.
  - udtryk: i modsat fald
    engelsk: otherwise
    eksempler: Hvis du ikke kan komme, så sig det til mig i morgen på hospitalet – i modsat fald regner jeg med, at du kommer.
  - udtryk: i nærheden af
    engelsk: near
    eksempler: Der holdt en lys bil i nærheden af deres hus.
  - udtryk: i ro og mag, i fred og ro
    engelsk: in peace and quiet
    eksempler: Byen er lige så charmerende og udgør det perfekte sted at sidde i fred og ro med et glas af ens foretrukne væske og bare slappe af og suge stemningen ind.
  - udtryk: i sagens natur
    engelsk: inherently
    eksempler: En anmeldelse med erstatningskrav kan i sagens natur ikke foregå anonymt.
  - udtryk: i sammenligning med
    engelsk: i comparison with
    eksempler: I sammenligning med andre i-lande yder Danmark en relativt stor udviklingsbistand.
  - udtryk: i spidsen
    engelsk: in charge, be the head
    eksempler: I et halvt år har Karen Melson været administrerende direktør for hotellet og i spidsen for 55 ansatte.
  - udtryk: i stedet (for)
    engelsk: instead (of)
    eksempler: Ønsker De ikke at blive medlem, så send os venligst et bidrag i stedet.
  - udtryk: i store/korte/grove træk
    engelsk: basically
    eksempler: Vi vil .. her i meget store træk beskrive, hvad pensionen består af.
  - udtryk: i særdeleshed
    engelsk: in particular
    eksempler: USA og i særdeleshed Japan løber os over ende i det teknologiske kapløb.
  - udtryk: i takt med
    engelsk: in line with
    eksempler: Rådgivningsbehovet er vokset i takt med en stadig mere kompliceret produktion.
  - udtryk: i tilknytning til
    engelsk: in connection with
    eksempler: I tilknytning til nogle af krisecentrene er der .. etableret selvhjælpsgrupper, kvinderådgivninger, aktivitetscentre m.v.
  - udtryk: i to (tre, fire, ...) tempi
    engelsk: in two (three, four, ..) times
    eksempler: Vil man selv behandle sit træ, skal det foregå i to tempi og med to slags beskyttelser.
  - udtryk: i træk
    engelsk: in a row
    eksempler: Nationalbanken blev for anden dag i træk tvunget til at støtte den svækkede danske krone.
  - udtryk: i tvivl (om)
    engelsk: in doubt (about)
    eksempler: Fru Kristensen er ikke i tvivl. Hun tror på Gud og et liv efter døden.
  - udtryk: i virkeligheden
    engelsk: in reality
    eksempler: Jeres problem har et seksuelt udtryk, men ligger i virkeligheden på et meget dybere mellemmenneskeligt plan.
  - udtryk: i øjeblikket, for tiden
    engelsk: at the moment
    eksempler: Lene er i lære som advokatsekretær, og Mette arbejder for tiden som kassedame i et supermarked.
  - udtryk: idømme nogen straf, dømme nogen til straf
    engelsk: impose a penalty on sb
    eksempler: En nordsjællandsk sparekassebestyrer er blevet dømt for millionsvindel.
  - udtryk: ingen vegne, ikke nogen vegne
    engelsk: nowhere
    eksempler: Man kommer ingen vegne med løftede pegefingre. Det handler om at være åben og lytte.
  - udtryk: jo ... jo/des/desto ..., des/desto ... des/desto ...
    engelsk: the more ... the more ...
    eksempler: Jo bedre barnet sover om dagen, desto bedre bliver nattesøvnen ofte.
  - udtryk: klæde sig på
    engelsk: dress
    eksempler: Det meste af formiddagen er jeg i badekåbe, og jeg klæder mig først på til frokost.
  - udtryk: komme i kontakt med
    engelsk: get in touch with
