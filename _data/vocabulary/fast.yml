  - udtryk: Ingen ko på isen.
    engelsk: Everything is okay.
  - udtryk: At gå agurk.
    engelsk: Express anger or extreme enthusiasm.
  - udtryk: Hvad er på tapetet i dag?
    engelsk: To know the agenda or what the plan is.
  - udtryk: Poy-Poy!
    engelsk: Good luck!
  - udtryk: Tak for kaffe.
    engelsk: Said when you are indicating surprise, astonishment or offence.
  - udtryk: Rent på spanden.
    engelsk: When you are broke and in need of money, or just in trouble with something.
  - udtryk: Få blod på tanden.
    engelsk: Eager to keep learning about or doing something you have just been introduced to.
  - udtryk: Lægge hovedet i blød.
    engelsk: To think.
  - udtryk: Slå på tråden.
    engelsk: Make a phone call.
  - udtryk: Spis brød til.
    engelsk: Take it easy.
  - udtryk: Der ligger hunden begravet.
    engelsk: There is the problem.
  - udtryk: Bide i det sure æble.
    engelsk: To do something you don’t really want to do.
  - udtryk: Hale torsk i land.
    engelsk: To snore.
  - udtryk: Der er ugler i mosen.
    engelsk: Something is wrong.
