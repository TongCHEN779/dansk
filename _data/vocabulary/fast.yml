    eksempler: Festivalfolket i Roskilde måtte væbne sig med stor tålmodighed .. Flere tusinde måtte stå i kø en times tid.
  - udtryk: være ensbetydende med
    engelsk: be synonymous with
    eksempler: Et liv som diabetiker er ensbetydende med nøje blodsukkerkontrol og diæt.
  - udtryk: være med til
    engelsk: help to
    eksempler: Det at være den ældste eller den yngste, den mellemste eller enebarn er med til at forme ens identitet.
  - udtryk: være/blive nødt til
    engelsk: need to
    eksempler: Jeg var flere gange nødt til at sige hva, fordi jeg ikke havde hørt ordentligt efter.
  - udtryk: være opkaldt efter
    engelsk: be named after
    eksempler: Menières sygdom er opkaldt efter den franske læge Prosper Menière (1799-1862).
  - udtryk: være optaget af
    engelsk: be concerned with
    eksempler: Når jeg bliver optaget af en ting, glemmer jeg tiden.
  - udtryk: være plaget af
    engelsk: be bothered by
    eksempler: De central- og østeuropæiske lande plages af økonomiske overgangsproblemer.
  - udtryk: være på vej
    engelsk: on the way
    eksempler: Hun bar på en kurv med grøntsager og var øjensynligt på vej hjem fra markedet.
  - udtryk: være rystet over
    engelsk: be upset about
    eksempler: Jeg er lidt rystet over fremgangsmåden her i aften!.
  - udtryk: være spændt på
    engelsk: be excited about
    eksempler: Jeg elsker New York og er spændt på, hvordan det er at bo der.
  - udtryk: være stolt af
    engelsk: be proud of
    eksempler: Jeg er da lidt stolt af mig selv over at jeg helt har lagt cigaretrygningen bag mig.
  - udtryk: være ude med riven
    engelsk: lash out
    eksempler: Det er ikke første gang, at ECB er ude med riven over for regeringerne.
  - udtryk: være vant til
    engelsk: be used to
    eksempler: Hun var vant til at klare sig selv.
  - udtryk: være velegnet til
    engelsk: be suitable for
    eksempler: Svinetarme viste sig at være velegnede til fremstilling af strenge til badmintonketsjere.
  - udtryk: være/komme/blive væk fra
    engelsk: be/come/become away from
    eksempler: Magnetfeltets styrke bliver mindre, jo længere man kommer væk fra anlægget.
  - udtryk: være værd at
    engelsk: be worth doing
    eksempler: Med solen lige i ansigtet og udsigt til det solglitrende Øresund, føles livet værd at leve.
  - udtryk: ærlig(t) talt
    engelsk: honestly speaking
    eksempler: Ærlig talt, Janne – sådan som du klæder dig, kan du ikke forvente, at chancerne skal regne ned over dig!
