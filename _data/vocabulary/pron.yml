  - Spørgeord: Hvorfor
    Engelsk: Why
    Eksempler: Hvorfor stå tidligt op, når man er arbejdsløs?
  - Spørgeord: Hvorfra
    Engelsk: Where ... from
    Eksempler: Hvorfra gik flugtruterne?
  - Spørgeord: Hvori
    Engelsk: What
    Eksempler: Hvori består vores danskhed i grunden?
  - Spørgeord: Hvormed
    Engelsk: How
    Eksempler: Hvormed kan jeg være til tjeneste?
  - Spørgeord: Hvornår
    Engelsk: When
    Eksempler: Hvornår kommer du hjem?
  - Spørgeord: Hvortil
    Engelsk: Where ... to
    Eksempler: Hvortil gik jeres første rejse?
  - Spørgeord: Hvorved
    Engelsk: How
