  - Spørgeord: Hvor mange
    Engelsk: How many
    Eksempler: Hvor mange penge vil vi sætte af?
  - Spørgeord: Hvor meget
    Engelsk: How much
    Eksempler: Hvor meget kan der spares i de forskellige afdelinger?
  - Spørgeord: Hvor tit
    Engelsk: How often
    Eksempler: Hvor tit gik I i biffen, kan du huske det?
