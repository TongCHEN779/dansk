    Engelsk: Which
    Eksempler: Hvilke holdninger har befolkningen til genteknologi – og hvilken viden?
  - Spørgeord: Hvis
    Engelsk: Whose
    Eksempler: Hvis skyld er det, at folkeskoleeleverne har alle de mangler?
  - Spørgeord: Hvor
    Engelsk: Where
    Eksempler: Hvor er mine briller?
