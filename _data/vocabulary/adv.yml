  - adverb: gennem årene
    engelsk: over the years
    eksempler: Kommissionen har endvidere gennem årene bistået en lang række ikke-statslige organisationer i det opinionsdannende arbejde.
  - adverb: i dagevis
    engelsk: for days
    eksempler: Jeg lå i sengen i dagevis og græd og græd og havde det virkelig dårligt
  - adverb: i sommerhalvåret
    engelsk: in the summer months
    eksempler: Pengene blev afdraget med 8 skilling ugentligt i sommerhalvåret og 4 skilling om vinteren.
  - adverb: indtil videre
    engelsk: so far
    eksempler: Min tur hernede er indtil videre gået helt fint.
  - adverb: på det tidspunkt
    engelsk: at that time
    eksempler: Hatte var på det tidspunkt en virkelig forbrugsvare, for ingen ordentlig dame gik barhovedet ud af sin gadedør.
  - adverb: somme tider
    engelsk: sometimes
    eksempler: Symptomerne er somme tider meget svage, og man behøver ikke at have dem alle, selv om man er smittet.
