sections:
- title: 'Hovedsætningskonjunktioner: S-V1-A-V2, K-S-V1-A-V2'
  entries:
  - konjunktion: både ... og ...
    engelsk: both ... and ...
    eksempler: Jeg fik prøvet både at svinge øksen og malke køer og trække saven.
  - konjunktion: eftersom
    engelsk: because
    eksempler: Eftersom han ikke var i stuen, gik hun ud fra, at han måtte være på toilettet.
  - konjunktion: eller
    engelsk: or
    eksempler: Vil du have kaffe eller te?.
  - konjunktion: enten ... eller ...
    engelsk: either ... or ...
    eksempler: Til sommer skal vi enten ud og sejle eller også på hyttetur til Norge.
  - konjunktion: for
    engelsk: since
    eksempler: Hold hovedet tildækket, for det er let at få solstik her.
  - konjunktion: hverken ... eller ...
    engelsk: neither ... nor ...
    eksempler: Hverken min fyr eller jeg er interesseret i at få børn nu.
  - konjunktion: men
    engelsk: but
    eksempler: Kvinden sagde noget mere, men Rikke hørte det ikke.
  - konjunktion: og
    engelsk: and
    eksempler: En god og praktisk løsning er, at de er sat fast med tryklåse.
  - konjunktion: så
    engelsk: so
    eksempler: Jeg har fridag, så jeg har tid nok.
  - konjunktion: såvel ... som ..., ... såvel som ...
    engelsk: '... as well as ...'
    eksempler: De pikante, men milde citroner er fine til såvel oliven som salater og fiskeretter.
- title: 'Ledsætningskonjunktioner: S-V1-A-V2, K-S-A-V1-V2'
  entries:
  - konjunktion: at
    engelsk: that
    eksempler: Knud hørte, at bedstefaren lagde værktøjet fra sig.
  - konjunktion: dels
    engelsk: partly
    eksempler: Tandkødsbetændelse forebygges dels ved jævnlig tandrensning, dels ved daglig, grundig tandbørstning.
  - konjunktion: eftersom
    engelsk: since
    eksempler: Eftersom han ikke var i stuen, gik hun ud fra, at han måtte være på toilettet.
  - konjunktion: end
    engelsk: than
    eksempler: Generalstrejken handler mere om politik end om økonomi.
  - konjunktion: fordi
    engelsk: because
    eksempler: Jeg blev hjemme, fordi jeg var syg.
  - konjunktion: før
    engelsk: before
    eksempler: Min farfar døde, før jeg blev født.
  - konjunktion: hvis/hvorvidt
    engelsk: if
    eksempler: Hvis De ønsker flere oplysninger, er De velkommen til at spørge Deres lokalkontor.
  - konjunktion: idet
    engelsk: as, while
    eksempler: Jeg faldt, idet jeg ville stå på bussen.
  - konjunktion: inden
    engelsk: before
    eksempler: Regnen silede ned, og inden hun nåede Vesterport, var hun gennemvåd.
  - konjunktion: indtil
    engelsk: until
    eksempler: Hjernen udvikles, indtil man er midt i 20'erne.
  - konjunktion: ligesom
    engelsk: just as
    eksempler: Bænkene er ligesom bordene af tunge egeplanker.
  - konjunktion: medmindre
    engelsk: unless
    eksempler: Fra årsskiftet må børn under tre år ikke sidde på forsædet af en bil, medmindre de er anbragt i en barnestol.
  - konjunktion: mens, imens
    engelsk: meanwhile
    eksempler: Mens jeg drikker kaffe, kigger jeg posten igennem.
  - konjunktion: når, da
    engelsk: when
    eksempler: Jeg ringer til dig, når jeg kommer hjem.
  - konjunktion: om/hvorvidt
    engelsk: whether
    eksempler: Hun spurgte, om jeg ville have en kop kaffe.
  - konjunktion: selvom, selv om
    engelsk: although
    eksempler: Lene går med ind, selvom hun ikke har lyst.
  - konjunktion: siden
    engelsk: since
    eksempler: Jeg har spillet tennis lige siden jeg var ni år.
  - konjunktion: som, som om
    engelsk: as, like
    eksempler: Han gik og gik – som i en feberrus.
  - konjunktion: så ... som muligt
    engelsk: as ... as possible
    eksempler: Oversættelserne vil fremkomme så hurtigt som muligt.
  - konjunktion: såsom
    engelsk: such as
    eksempler: Festdragterne blev anvendt til større fester, såsom konfirmationer, bryllupper og dans omkring majstangen.
  - konjunktion: uanset/uagtet
    engelsk: although
    eksempler: Uanset det er vældig sympatisk, så er det meget urealistisk.
  - konjunktion: undtagen
    engelsk: unless
    eksempler: Her bider sygdom ikke undtagen det er Vorherres vilje.
